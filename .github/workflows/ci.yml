name: CI - Security Tools & Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        
    - name: Run Pytest Test Suite
      run: |
        python -m pytest tests/ -v
        
    - name: Test CLI Security Tools
      run: |
        python scripts/cipher_toolkit.py --data "666c61677b746573747d" --mode hex
        python scripts/stego_inspector.py --file README.md
